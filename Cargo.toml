[package]
name = "syster-codegen"
version = "0.1.0"
edition = "2021"
description = "Parser generator for SysML v2"
license = "MIT"
readme = "README.md"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }

# Error handling
anyhow = "1.0"

# Utilities
heck = "0.5"       # Case conversion (PascalCase, snake_case, etc.)

[dev-dependencies]
pretty_assertions = "1.4"

[[bin]]
name = "syster-codegen"
path = "src/main.rs"

[lib]
name = "syster_codegen"
path = "src/lib.rs"
